<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Chat with Genesis — the AI assistant for Genesis Global Academy." />
  <meta name="theme-color" content="#011959" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Genesis AI" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon-96x96.png" />
  <link rel="apple-touch-icon" href="icon-192x192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="chatbot.css" />
  <title>Genesis AI — Genesis Global Academy</title>
</head>
<body>

<div class="chat-app">

  <!-- Header -->
  <header class="chat-header">
    <div class="chat-header-inner">
      <a href="index.html" class="chat-back" aria-label="Back to website">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div class="chat-brand">
        <div class="chat-brand-logo">
          <img src="genesis.png" alt="Genesis Global Academy" />
          <span class="chat-status-dot" aria-hidden="true"></span>
        </div>
        <div class="chat-brand-text">
          <h1>Genesis</h1>
          <span>Connected</span>
        </div>
      </div>
      <button class="chat-menu-btn" id="chatMenuBtn" aria-label="Menu">
        <i class="bi bi-three-dots-vertical"></i>
      </button>
    </div>
  </header>

  <!-- Menu drawer -->
  <div class="chat-menu-drawer" id="chatMenuDrawer">
    <button data-action="clear" class="chat-menu-item">
      <i class="bi bi-trash3"></i> Clear chat
    </button>
    <button data-action="help" class="chat-menu-item">
      <i class="bi bi-question-circle"></i> What can Genesis do?
    </button>
    <button data-action="close" class="chat-menu-item">
      <i class="bi bi-x-lg"></i> Close menu
    </button>
  </div>

  <!-- ADD this scrim right after the drawer div -->
<div class="chat-drawer-scrim" id="chatDrawerScrim"></div>

  <!-- Messages -->
  <main class="chat-body" id="chatBody" aria-live="polite"></main>

  <!-- Quick suggestions -->
  <div class="chat-suggestions" id="chatSuggestions">
    <button class="suggestion-chip" data-suggest="What's happening recently?">
      <i class="bi bi-newspaper"></i> Recent news
    </button>
    <button class="suggestion-chip" data-suggest="Show me nursery class material">
      <i class="bi bi-book"></i> Study material
    </button>
    <button class="suggestion-chip" data-suggest="Who is the Principal?">
      <i class="bi bi-people"></i> Faculty
    </button>
    <button class="suggestion-chip" data-suggest="Office hours and location">
      <i class="bi bi-geo-alt"></i> Location
    </button>
    <button class="suggestion-chip" data-suggest="Show me sports photos">
      <i class="bi bi-images"></i> Sports photos
    </button>
    <button class="suggestion-chip" data-suggest="Tell me the founder's story">
      <i class="bi bi-award"></i> Founder's story
    </button>
    <button class="suggestion-chip" data-suggest="What do parents say?">
      <i class="bi bi-star"></i> Reviews
    </button>
    <button class="suggestion-chip" data-suggest="Check my admission status">
      <i class="bi bi-search"></i> Admission status
    </button>
  </div>

  <!-- Composer -->
  <footer class="chat-composer">
    <form id="chatForm" class="chat-input-wrap" autocomplete="off">
      <button type="button" class="chat-plus-btn" id="chatPlusBtn" aria-label="Quick actions">
        <i class="bi bi-plus-lg"></i>
      </button>
      <input
        type="text"
        id="chatInput"
        class="chat-input"
        placeholder="Ask Genesis anything..."
        aria-label="Type your message"
        maxlength="500"
      />
      <button type="submit" class="chat-send-btn" id="chatSendBtn" aria-label="Send">
        <i class="bi bi-send-fill"></i>
      </button>
    </form>
  </footer>

</div>

<!-- MODAL — Admission status -->
<div class="chat-modal d-none" id="statusModal">
  <div class="chat-modal-overlay" data-close-modal></div>
  <div class="chat-modal-card">
    <button class="chat-modal-close" data-close-modal aria-label="Close"><i class="bi bi-x-lg"></i></button>
    <h3><i class="bi bi-search me-2"></i>Admission Status</h3>
    <p class="chat-modal-sub">Enter your reference ID (e.g. GGA-1A2B3C4D)</p>
    <form id="statusForm" class="chat-modal-form">
      <input type="text" id="statusInput" placeholder="GGA-XXXXXXXX" class="chat-modal-input" maxlength="20" required />
      <button type="submit" class="chat-modal-submit"><i class="bi bi-arrow-right"></i> Check Status</button>
    </form>
    <div id="statusResult" class="chat-modal-result"></div>
  </div>
</div>

<!-- MODAL — Gallery -->
<div class="chat-modal d-none" id="galleryModal">
  <div class="chat-modal-overlay" data-close-modal></div>
  <div class="chat-modal-card chat-modal-card--wide">
    <button class="chat-modal-close" data-close-modal aria-label="Close"><i class="bi bi-x-lg"></i></button>
    <h3 id="galleryModalTitle"><i class="bi bi-images me-2"></i>Gallery</h3>
    <div class="chat-gallery-grid" id="galleryModalGrid"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="chat-lightbox d-none" id="chatLightbox">
  <button class="chat-lightbox-close" id="chatLightboxClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
  <button class="chat-lightbox-prev" id="chatLightboxPrev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
  <img src="" alt="" class="chat-lightbox-img" id="chatLightboxImg" />
  <button class="chat-lightbox-next" id="chatLightboxNext" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
</div>

<script src="chatbot.js"></script>
</body>
</html>
