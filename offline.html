<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#011959" />
  <title>Offline – World of Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #011959 0%, #0a2570 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }
    .wrap {
      text-align: center;
      max-width: 480px;
      animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin: 0 auto 1.5rem;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.35));
      display: block;
    }
    .icon-wrap {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(194, 183, 119, 0.15);
      border: 2px solid #C2B777;
      color: #C2B777;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }
    p {
      color: rgba(255, 255, 255, 0.75);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;
    }
    .btn-primary {
      background: #C70037;
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: #a5002e;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(199, 0, 55, 0.4);
    }
    .btn-ghost {
      background: transparent;
      color: #C2B777;
      border: 2px solid #C2B777;
    }
    .btn-ghost:hover {
      background: #C2B777;
      color: #011959;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff5252;
      margin-right: 0.4rem;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .footnote {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="logo2.png" alt="World of Light" class="logo" onerror="this.style.display='none'" />

    <div class="icon-wrap">
      <i class="bi bi-wifi-off"></i>
    </div>

    <h1>You're Offline</h1>
    <p>
      <span class="status-dot"></span>
      It looks like you've lost your internet connection.
      The page you requested isn't available in your cache.
      Please check your connection and try again.
    </p>

    <div class="actions">
      <button class="btn btn-primary" onclick="location.reload()">
        <i class="bi bi-arrow-clockwise"></i>
        Try Again
      </button>
      <a class="btn btn-ghost" href="/index.html">
        <i class="bi bi-house-door-fill"></i>
        Go to Homepage
      </a>
    </div>

    <div class="footnote">Genesis Global Academy</div>
  </div>

  <script>
    // Auto-reload when the connection comes back
    window.addEventListener('online', () => {
      setTimeout(() => location.reload(), 400);
    });
  </script>
</body>
</html>
